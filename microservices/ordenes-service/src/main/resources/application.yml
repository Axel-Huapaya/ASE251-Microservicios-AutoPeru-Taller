server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ordenes-service
  main:
    # Spring MVC (servlet) manda aunque webflux este en el classpath: solo usamos WebClient
    web-application-type: servlet

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: prometheus
      path-mapping:
        prometheus: metrics
  metrics:
    tags:
      application: ordenes-service
    distribution:
      percentiles-histogram:
        http.server.requests: true

repuestos:
  # URL del Servicio A. En Kubernetes se resuelve por el nombre del Service.
  url: ${REPUESTOS_URL:http://localhost:8081}
  # Tiempo maximo de espera (ms) por una respuesta del servicio de repuestos
  timeout-ms: ${REPUESTOS_TIMEOUT_MS:2000}
