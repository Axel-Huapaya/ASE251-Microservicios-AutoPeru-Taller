# Configuracion propia del chart kube-prometheus-stack
# Instalacion: helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
#                -n monitoring --create-namespace -f k8s/monitoring/values.yaml

grafana:
  # CAMBIA ESTA CONTRASENA por la tuya antes de instalar
  adminPassword: "AutoPeru2026"
  service:
    type: NodePort
    nodePort: 30300

prometheus:
  service:
    type: NodePort
    nodePort: 30090
  prometheusSpec:
    # Por defecto el chart solo selecciona ServiceMonitors con el label release=<nombre del release>.
    # Con "false" y un selector vacio, Prometheus toma TODOS los ServiceMonitors...
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    # ...de TODOS los namespaces (incluido autoperu-taller)
    serviceMonitorNamespaceSelector: {}
    # Mismo criterio para las reglas de alerta (PrometheusRule) y PodMonitors
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}

alertmanager:
  service:
    type: NodePort
    nodePort: 30093
