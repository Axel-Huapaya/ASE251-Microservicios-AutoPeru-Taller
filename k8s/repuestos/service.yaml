apiVersion: v1
kind: Service
metadata:
  name: repuestos-service
  namespace: autoperu-taller
  labels:
    # El ServiceMonitor selecciona este Service por estos labels
    app: repuestos-service
spec:
  type: NodePort
  selector:
    app: repuestos-service
  ports:
    # El nombre "http" es obligatorio: el ServiceMonitor referencia el puerto por nombre
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30081
